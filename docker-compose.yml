version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: podcast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-pass}
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    volumes:
      - ./apps/backend:/app
      - ./libs/shared/python:/libs/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - PODCHASER_API_KEY=${PODCHASER_API_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  ml-service:
    build:
      context: .
      dockerfile: infra/docker/ml-service.Dockerfile
    volumes:
      - ./apps/ml-service:/app
      - ./libs/shared/python:/libs/shared
    ports:
      - "8001:8001"

  ingestion-service:
    build:
      context: .
      dockerfile: infra/docker/ingestion.Dockerfile
    volumes:
      - ./apps/ingestion-service:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PODCHASER_API_KEY=${PODCHASER_API_KEY}
      - PODCHASER_API_SECRET=${PODCHASER_API_SECRET}
    depends_on:
      - db
      - redis
    ports:
      - "8002:8002"

volumes:
  postgres_data:
