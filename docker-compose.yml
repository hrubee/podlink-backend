version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: podcast
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-pass}
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    volumes:
      - ./apps/backend:/app
      - ./libs/shared/python:/libs/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-pass}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - REVENUECAT_API_KEY=${REVENUECAT_API_KEY}
      - REVENUECAT_WEBHOOK_SECRET=${REVENUECAT_WEBHOOK_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-11520}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  ml-service:
    build:
      context: .
      dockerfile: infra/docker/ml-service.Dockerfile
    volumes:
      - ./apps/ml-service:/app
      - ./libs/shared/python:/libs/shared
    ports:
      - "8001:8080"

volumes:
  postgres_data:
