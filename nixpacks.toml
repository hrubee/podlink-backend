# Nixpacks configuration for Railway backend deployment
# Railway will use this if no Dockerfile is detected, or if you set builder to NIXPACKS

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["pip install -r apps/backend/requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "cd apps/backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
